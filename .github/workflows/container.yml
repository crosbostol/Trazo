name: Build Trazo containers
on:
  push:
    branches: [codex/cosmos-spike]
    paths: ['backend/**', 'frontend/**', 'Dockerfile', '.github/workflows/container.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: trazo-container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: checkpoint
            ref: v0.1.0
            tag: checkpoint-v0.1.0
          - variant: candidate
            ref: ${{ github.sha }}
            tag: candidate-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/crosbostol/trazo:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/crosbostol/Trazo
            org.opencontainers.image.revision=${{ matrix.ref }}
          provenance: mode=max
      - name: Record immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: printf '%s ghcr.io/crosbostol/trazo@%s\n' "$VARIANT" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
